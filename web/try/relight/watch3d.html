<title>Watch 3D trial</title>
<!--
  watch3d.html — the 3D exercise, round 26 (5 Nov 2026): round 14 rebuilt from the photographs round ONE RULE; 15 gave the sweeps tangents; 16 the lug its belly and tip chamfer; 17 every sweep wound outward (the AO pass is FrontSide); 18 the teeth lower; 19 the cushion dropped; 20 the outer links' flanks convex; 21 the crown's dome and shoulder; 22 a Ground grain/plain switch; 23 the strap a flat band after ref-29; 24 its fold round the bar; 25 its end clear of the body; 26 keepers as leather loops.

  Every part of a watch is a SECTION swept along a PATH, with a FINISH per face. A case band is a flank section carried
  round the case's outline; a lug is a slab section carried from the band to its tip, thinning as it goes; a bracelet link
  is a bean, barn or slab section carried along the link, its ends rounding so it can hinge; a bezel's teeth are one tooth
  carried round the ring; a crown is a profile spun round its stem. So the whole watch is DATA — the CASES and BRACELETS
  tables below — and one small set of builders (sweep · lathe · link · chain). A new case is a new row, a new bracelet a new
  row; the Illustrator sheet Okay will draw is the profiles' half of such a row.

  What the photographs settled (5 Nov 2026, Okay's references):
   · a lug is a slab leaving the case BAND, not the caseback: flat brushed top, polished flank, a wide polished chamfer along
     the top edge that runs to the tip; the tip a flat chamfered end face; the spring-bar hole a small drilled dot in the flank
   · the end link sits inside the lug tips and a little under the lug tops; its nose a half-round
   · links: bean (round ends, flat polished flanks with screws), barn (chamfered shoulders), slab (one bright bevel); the
     centre column half a pitch off the outer ones; thickness, width and pitch all taper from the case
   · bezel teeth are prismatic blocks with gaps, not ripples; the crown is fluted, domed, chamfered
-->

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
const scene3 = window.SCENE;      // the dial's parts (dump.mjs)
const DIAL_Z = 10.0;              // the dial's face, mm over the caseback; world y = 0 there
const W = (x, y, z) => [x, z - DIAL_Z, -y];      // case space (x, y of the dial plane, z up from the caseback) → world (dial y, 12 o'clock, is −z)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), ss = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }, rad = (d) => d * Math.PI / 180;

// ── 1 · the specs: one case (the cushion was dropped in round 19 — Okay: "sub par"; its row is in the history), three bracelets ──────────────────────────────────────────────────────────────────────────
const CASES = {
  // after the SPB143 / Submariner photographs: a round band with a belly and a polished chamfer, slab lugs with a flare in plan
  diver: { name: "Diver", plan: "round", R: 20.25, l2l: 47.6, lugw: 20, lugT: 2.9, flare: 3.6, zBand: 2.4, zTop: 9.3, belly: 0.3, chamfer: 0.9, flank: "polished",
    lug: { tipTop: 7.3, tipBot: 4.1, rootBot: 2.4, chamferTip: 0.75, holeIn: 1.6, corner: 0.8 },
    bezel: { r0: 16.3, r1: 19.6, z0: 9.6, z1: 11.9, teeth: { n: 60, depth: 0.5, fill: 0.62, chamfer: 0.45 } },
    crown: { at: 0, w: 6.4, h: 3.0, z: 6.0, flutes: 18 } },
};
// a bracelet: columns across (a share of the width, a section, which side faces out, half a pitch off or not, an optional
// finish "polished" for a column — the Sub's centre links; the goal's SPB143 is all brushed, so none here), and the
// taper laws from the case (W0, H0, P0) to the clasp (W1, H1, P1)
const BRACELETS = {
  oyster: { W1: 18, P0: 8.4, P1: 7.0, H1: 2.6, gapx: 0.14, gap: 0.12, columns: [[0.31, "slab", -1, 0], [0.38, "slab", 0, 0.5], [0.31, "slab", 1, 0]] },
  barn: { W1: 18, P0: 8.0, P1: 6.8, H1: 2.8, gapx: 0.16, gap: 0.14, columns: [[0.30, "barn", -1, 0], [0.40, "barn", 0, 0.5], [0.30, "barn", 1, 0]] },
  jubilee: { W1: 17.5, P0: 7.0, P1: 6.0, H1: 2.5, gapx: 0.1, gap: 0.1, columns: [[0.25, "bean", -1, 0], [0.167, "barrel", 0, 0.5], [0.167, "barrel", 0, 0.5], [0.167, "barrel", 0, 0.5], [0.25, "bean", 1, 0]] },
};

// ── 2 · the builders ───────────────────────────────────────────────────────────────────────────────────────────────────
/** a SWEEP: `stations` is a list of sections (each the same count of [x, y, z] points); between two stations every edge of
 *  the section becomes a strip of quads, and `mats[e]` names the material of edge e — so one mesh can wear a brushed top
 *  and a polished chamfer. A closed section joins its last point to its first; closed ends get a fan cap (mats[n]) */
function sweep(stations, mats, { closeSection = true, caps = false, crease = 40 } = {}) {
  const n = stations[0].length, S = stations.length, E = closeSection ? n : n - 1, g = new THREE.BufferGeometry(), v = [], uv = [], tan = [], idx = [], groups = [];
  // TANGENTS: the brushed grain runs along the path, so every vertex gets the path's direction there (the station before to
  // the station after; w = 1 is the handedness). Without this attribute three.js builds the frame per pixel from screen-space
  // UV derivatives, which jumps per facet on a sweep — and the anisotropic reflection follows that frame, not the surface, so
  // whole faces mirrored the key light and went white (round 14). Lathes and plates never needed it: their derivatives are smooth
  const T = new THREE.Vector3(), last = new THREE.Vector3(1, 0, 0), tangentAt = (k, i) => { const a = stations[Math.max(0, k - 1)][i], b = stations[Math.min(S - 1, k + 1)][i];
    T.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]); if (T.lengthSq() > 1e-10) last.copy(T.normalize()); return last; };      // a pinched station (a link's end) keeps the last direction
  // EVERY STRIP OWNS ITS VERTICES: two faces meeting at a section point do not share it, so a corner stays a corner — shared
  // points averaged the normals across the edge and a slab shaded like the inside of a tube (round 16, "I can see inside the lug").
  // Along the path the normals stay smooth; across the section they are smoothed only where the bend is gentler than `crease`°
  const push = (k, i) => { const p = stations[k][i], t = tangentAt(k, i); v.push(...p); uv.push(k / (S - 1) * 4, i / n); tan.push(t.x, t.y, t.z, 1); return v.length / 3 - 1; };
  const at = [];      // at[e][k] = [vertex of point e, vertex of point e+1] in strip e at station k
  for (let e = 0; e < E; e++) { const e2 = (e + 1) % n, s0 = idx.length; at[e] = [];
    for (let k = 0; k < S; k++) at[e][k] = [push(k, e), push(k, e2)];
    for (let k = 0; k + 1 < S; k++) { const [a, b] = at[e][k], [c, d] = at[e][k + 1]; idx.push(a, c, b, b, c, d); }
    groups.push([s0, idx.length - s0, mats[e] ?? 0]); }
  if (caps) for (const [k, which] of [[0, 0], [S - 1, 1]]) { const s0 = idx.length, base = v.length / 3; for (let i = 0; i < n; i++) push(k, i);
    for (let i = 1; i + 1 < n; i++) idx.push(base, base + (which ? i + 1 : i), base + (which ? i : i + 1));
    groups.push([s0, idx.length - s0, mats[n] ?? 0]); }
  // FACES OUTWARD: a mirrored sweep (a lug on the other side) winds its triangles inward. The colour pass is DoubleSide and
  // doesn't care, but the AO pass (GTAOPass: MeshNormalMaterial, FrontSide) culls the near wall and takes its depth and
  // normals from the far wall inside the solid — the inside showed through the lug (round 16). Measure the winding
  // (do the faces point away from the part's centre?) and flip the order if not
  { let cx = 0, cy = 0, cz = 0; const nv = v.length / 3; for (let i = 0; i < v.length; i += 3) { cx += v[i]; cy += v[i + 1]; cz += v[i + 2]; } cx /= nv; cy /= nv; cz /= nv;
    let score = 0; for (let t = 0; t < idx.length; t += 3) { const [a, b, c] = [idx[t] * 3, idx[t + 1] * 3, idx[t + 2] * 3];
      const ux = v[b] - v[a], uy = v[b + 1] - v[a + 1], uz = v[b + 2] - v[a + 2], wx = v[c] - v[a], wy = v[c + 1] - v[a + 1], wz = v[c + 2] - v[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;      // the face's normal, scaled by its area
      score += nx * ((v[a] + v[b] + v[c]) / 3 - cx) + ny * ((v[a + 1] + v[b + 1] + v[c + 1]) / 3 - cy) + nz * ((v[a + 2] + v[b + 2] + v[c + 2]) / 3 - cz); }
    if (score < 0) for (let t = 0; t < idx.length; t += 3) { const s = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = s; } }
  g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2)); g.setAttribute("tangent", new THREE.Float32BufferAttribute(tan, 4));
  g.setIndex(idx); for (const [a, b, m] of groups) g.addGroup(a, b, m); g.computeVertexNormals();
  // the crease pass: where two strips meet at a gentle angle (a bean's arc, the band's belly) blend their normals back together
  const N = g.attributes.normal, A = new THREE.Vector3(), B = new THREE.Vector3(), cosC = Math.cos(crease * Math.PI / 180);
  for (let e = 0; e < E; e++) { const f = (e + 1) % n; if (!closeSection && f === E) break; if (!at[f]) continue;
    for (let k = 0; k < S; k++) { const a = at[e][k][1], b = at[f][k][0]; A.fromBufferAttribute(N, a); B.fromBufferAttribute(N, b);
      if (A.dot(B) > cosC) { A.add(B).normalize(); N.setXYZ(a, A.x, A.y, A.z); N.setXYZ(b, A.x, A.y, A.z); } } }
  N.needsUpdate = true; return g;
}
/** a part spun round the dial's axis: `pts` [r, z] in case space */
const lathe = (pts, seg = 256) => new THREE.LatheGeometry(pts.map(([r, z]) => new THREE.Vector2(r, z - DIAL_Z)), seg);
const mesh = (geo, mat, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = shadow; for (const mm of [].concat(mat)) mm.side = THREE.DoubleSide; return m; };

// ── 3 · materials: a small named list ──
const METAL = { steel: "#c9c9c6", gold: scene3.metal }; let metalHex = METAL.steel; const leatherHex = scene3.leather, floorHex = scene3.floor;
const metalMat = (rough, aniso) => Object.assign(new THREE.MeshPhysicalMaterial({ color: metalHex, metalness: 1, roughness: rough, anisotropy: aniso }), { userData: { metal: true } });
const MATERIALS = {
  polished: () => metalMat(0.16, 0), brushed: () => metalMat(0.36, 0.85),
  paint: (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0, roughness: 0.45, clearcoat: 0.9, clearcoatRoughness: 0.15 }),
  insert: (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0.6, roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  sapphire: () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.0, transmission: 1, thickness: 0.05, ior: 1.76, transparent: true, side: THREE.DoubleSide }),
  leather: () => new THREE.MeshPhysicalMaterial({ color: leatherHex, metalness: 0, roughness: 0.62, clearcoat: 0.15, clearcoatRoughness: 0.6 }),      // smooth calf: matte-satin, a soft broad highlight (ref-29)
  edge: () => new THREE.MeshPhysicalMaterial({ color: new THREE.Color(leatherHex).multiplyScalar(0.55), metalness: 0, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.4 }),      // the burnished cut edge: darker, a little glossier (ref-34)
  lining: () => new THREE.MeshPhysicalMaterial({ color: new THREE.Color(leatherHex).multiplyScalar(0.85), metalness: 0, roughness: 0.9 }),
  dark: () => new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.95, metalness: 0 }),
  hand: (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0.9, roughness: 0.42 }),
};
const PB = () => [MATERIALS.polished(), MATERIALS.brushed()];      // the usual pair: 0 polished, 1 brushed

// ── 4 · the scene ──
const canvas = document.getElementById("gl"), status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color(floorHex);
// the room the metal reflects: a light tent with a key softbox high at the upper left, fills, a black flag over the lens
// (what polished tops and the crystal mirror straight back at a camera above), a darker table below
function studio() { const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.MeshBasicMaterial({ color: 0x8a8a8a, side: THREE.BackSide })));
  const box = (w, h, x, y, z, lum) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(lum) })); m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
  box(70, 50, -60, 45, -40, 9); box(60, 40, 70, 25, 0, 3.5); box(40, 20, 0, 20, 70, 2.5); box(50, 30, 0, 12, -70, 2);
  { const flag = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(0.04) })); flag.position.set(0, 95, 0); flag.lookAt(0, 0, 0); s.add(flag); }
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(0.35) })).rotateX(-Math.PI / 2).translateZ(-60));
  return s; }
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(studio(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(22, 1, 10, 2000);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 100, 100); gtao.output = GTAOPass.OUTPUT.Default;
gtao.updateGtaoMaterial({ radius: 2.2, distanceExponent: 1, thickness: 1, scale: 2.2, samples: 16, distanceFallOff: 1, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 4, radiusExponent: 1, rings: 2, samples: 16 });
composer.addPass(gtao); composer.addPass(new OutputPass());
const K = scene3.size;      // the case scaled to the dial, as watch.js does
const watch = new THREE.Group(); watch.scale.setScalar(K); scene.add(watch);
const caseGroup = new THREE.Group(), strapGroup = new THREE.Group(); watch.add(caseGroup, strapGroup);

// ── 5 · the case ───────────────────────────────────────────────────────────────────────────────────────────────────────
/** the body's plan outline: a point and its outward normal at angle θ, and the outline's y at a given x (for the lugs) */
function outline(C) {
  if (C.plan === "round") return { at: (th) => ({ p: [C.R * Math.cos(th), C.R * Math.sin(th)], n: [Math.cos(th), Math.sin(th)] }), yAt: (x) => Math.sqrt(Math.max(0, C.R * C.R - x * x)), xMax: C.R };
  const pt = (th) => { const c = Math.cos(th), s = Math.sin(th); return [C.a * Math.sign(c) * Math.abs(c) ** (2 / C.n), C.b * Math.sign(s) * Math.abs(s) ** (2 / C.n)]; };
  return { at: (th) => { const p = pt(th), q = pt(th + 1e-3), r = pt(th - 1e-3), tx = q[0] - r[0], ty = q[1] - r[1], l = Math.hypot(tx, ty); return { p, n: [ty / l, -tx / l] }; },
    yAt: (x) => C.b * Math.max(0, 1 - (Math.abs(x) / C.a) ** C.n) ** (1 / C.n), xMax: C.a };
}
function buildCase(C) {
  const g = new THREE.Group(), O = outline(C), half = C.l2l / 2, xi = C.lugw / 2, xo = xi + C.lugT;
  // the caseback: a polished dish under the body
  g.add(mesh(lathe([[0, 0], [O.xMax - 2.6, 0], [O.xMax - 1.0, 0.9], [O.xMax - 0.3, C.zBand]]), MATERIALS.polished()));
  // the band: the flank section carried round the outline — up from zBand with a belly, then the chamfer in to the top
  { const N = C.plan === "round" ? 256 : 320, stations = [], H = C.zTop - C.zBand, ZS = 7;
    for (let k = 0; k <= N; k++) { const { p, n } = O.at(k / N * 2 * Math.PI), pts = [];
      for (let j = 0; j <= ZS; j++) { const z = C.zBand + (H - C.chamfer) * j / ZS, d = C.belly * Math.sin(Math.PI * (z - C.zBand) / H); pts.push(W(p[0] + n[0] * d, p[1] + n[1] * d, z)); }
      pts.push(W(p[0] - n[0] * C.chamfer, p[1] - n[1] * C.chamfer, C.zTop)); stations.push(pts); }
    const mats = Array(ZS).fill(C.flank === "polished" ? 0 : 1).concat([0]);      // the flank's strips, then the chamfer polished
    g.add(mesh(sweep(stations, mats, { closeSection: false }), PB())); }
  // the top plate: the outline less the bezel's seat, brushed; a bottom plate too where the caseback dish doesn't reach (the cushion)
  { const sh = new THREE.Shape(); for (let k = 0; k <= 256; k++) { const { p, n } = O.at(k / 256 * 2 * Math.PI); if (k) sh.lineTo(p[0] - n[0] * C.chamfer, p[1] - n[1] * C.chamfer); else sh.moveTo(p[0] - n[0] * C.chamfer, p[1] - n[1] * C.chamfer); }
    const hole = new THREE.Path(); hole.absarc(0, 0, C.bezel.r0, 0, Math.PI * 2, true); sh.holes.push(hole);
    const top = mesh(new THREE.ShapeGeometry(sh, 4), MATERIALS.brushed()); top.rotation.x = -Math.PI / 2; top.position.y = C.zTop - DIAL_Z; g.add(top);
    if (C.plan !== "round") { const sh2 = new THREE.Shape(); for (let k = 0; k <= 256; k++) { const { p } = O.at(k / 256 * 2 * Math.PI); if (k) sh2.lineTo(p[0], p[1]); else sh2.moveTo(p[0], p[1]); }
      const bot = mesh(new THREE.ShapeGeometry(sh2, 4), MATERIALS.polished()); bot.rotation.x = -Math.PI / 2; bot.position.y = C.zBand - DIAL_Z; g.add(bot); } }
  // the lugs: a slab section (inner wall · top · chamfer · outer wall · underside) carried from inside the band to the tip,
  // the top falling and the underside rising by the lug's laws, the chamfer running to the tip, the tip's corners rounded in plan
  const yEdge = O.yAt(xi), L = C.lug, u = (y) => clamp((y - yEdge) / (half - yEdge), 0, 1);
  const lugTop = (y) => C.zTop - (C.zTop - L.tipTop) * ss(u(y)), lugBot = (y) => L.rootBot + (L.tipBot - L.rootBot) * ss(Math.pow(u(y), 1.3));
  const xb = xo + C.flare, yb = O.yAt(xb);      // for a flared lug the outer edge leaves the body at (xb, yb) and curves in to xo at the tip (watch.js lugPath's curve)
