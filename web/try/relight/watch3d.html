<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch 3D trial</title>
<!--
  watch3d.html — round 1 of the 3D exercise (4 Nov 2026; Okay: "Profiles and rehaut and all them necessary … let's think
  of a sustainable system … Draft sheets as we go").

  The system: a case is a SHEET — cross-section profiles in millimetres (r out from the axis, z up from the caseback),
  one per round part, each with a material name. Each profile is spun round the dial's axis (a lathe); the parts that
  aren't round (lugs, crown, strap) are outlines pulled up to a height. The dial is Dial Tool's own drawing laid on the
  plate as a picture; the hands are their own paths pulled up with a bevel. One studio room lights everything (reflections
  on the metal), one soft sun from the app's angle and height casts the shadows.

  Round 1: the diver only (Seiko SPB143's numbers, scaled to the dial), three.js's built-in room, no crown knurl, no bracelet.
  The SHEET below is what you will later draw in Illustrator; for now it is written here, and drawn on the right.
-->
<style>
  body { margin: 0; background: #1c1c1f; color: #ddd; font: 13px/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; display: grid; grid-template-columns: 1fr 260px; height: 100vh; }
  #stage { position: relative; display: grid; place-items: center; overflow: hidden; }
  canvas#gl { display: block; touch-action: none; cursor: crosshair; }
  #side { padding: 16px 18px; background: #2a2622; border-left: 1px solid #000; overflow: auto; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 14px; }
  .pills { display: flex; gap: 4px; margin-bottom: 14px; }
  .pills button { flex: 1; border: 1px solid #666; background: none; color: #ddd; border-radius: 99px; padding: 5px 0; font: inherit; cursor: pointer; }
  .pills button.on { background: #ddd; color: #111; border-color: #ddd; }
  label { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 8px; margin: 10px 0 2px; }
  input[type=range] { width: 100%; margin: 0 0 6px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: #aaa; }
  p.note { color: #998; margin: 14px 0 0; }
  #sheet { width: 100%; margin-top: 14px; background: #1c1c1f; border: 1px solid #000; }
  #status { position: absolute; left: 12px; bottom: 10px; color: #998; }
</style>
<div id="stage"><canvas id="gl"></canvas><div id="status">loading three.js…</div></div>
<div id="side">
  <h1>Watch 3D · round 7</h1>
  <div class="pills" id="light"><button data-m="studio" class="on">Studio</button><button data-m="sun">Sun</button></div>
  <div class="pills" id="view"><button data-v="top" class="on">Top</button><button data-v="photo">Photo</button></div>
  <div class="pills" id="metal"><button data-m="steel" class="on">Steel</button><button data-m="gold">Gold</button></div>
  <div class="pills" id="strap"><button data-s="leather">Leather</button><button data-s="bracelet" class="on">Bracelet</button></div>
  <label>Sun from <span class="num" id="v-from"></span></label><input type="range" id="from" min="0" max="359" value="135">
  <label>Sun height <span class="num" id="v-rise"></span></label><input type="range" id="rise" min="12" max="85" value="40">
  <label>Sun strength <span class="num" id="v-sun"></span></label><input type="range" id="sun" min="0" max="100" value="60">
  <label>Room light <span class="num" id="v-room"></span></label><input type="range" id="room" min="0" max="100" value="60">
  <label>Polish <span class="num" id="v-polish"></span></label><input type="range" id="polish" min="0" max="100" value="75">
  <p class="note">Drag on the watch: the direction is the sun's angle, the middle high, the edge low. The sheet: the diver's cross-section — what is spun round the axis. Blue is the crystal.</p>
  <svg id="sheet" viewBox="0 0 24 16"></svg>
</div>
<script src="scene.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
const scene3 = window.SCENE;      // the dial's parts (dump.mjs)

// ── 1 · the sheet: the diver's cross-sections, mm at the published size (SPB143: Ø 40.5, 13.2 tall, l2l 47.6, lugs 20) ──
// Each profile is a list of [r, z] points walked round the part's section (r out from the axis, z up from the
// caseback); spun round the axis it becomes the part. Z of the dial's face: DIAL_Z.
const DIAL_Z = 10.0;
const SHEET = {
  back: { material: "polished", pts: [[0, 0], [17.5, 0], [19.0, 0.6], [19.9, 3.2], [0, 3.2]] },      // the caseback and the lower flank: under the body, down to the table
  seat: { material: "polished", pts: [[16.3, 9.0], [19.9, 9.0], [19.9, 9.6], [16.3, 9.6]] },      // the ring the bezel sits on; the case body itself is below (an outline pulled up, lugs and all)
  rehaut: { material: "polished", pts: [[14.6, DIAL_Z], [15.2, 11.35], [16.1, 11.5], [16.3, 11.5], [16.3, 9.6], [14.6, 9.6]] },      // the ring from the dial up to the bezel: a steep polished wall 1.35 mm tall and 0.6 wide, then a flat top — the slope you see round the dial
  bezel: { material: "brushed", pts: [[16.3, 9.6], [20.0, 9.6], [20.0, 11.9], [19.4, 12.45], [19.0, 12.45], [19.0, 11.9], [16.7, 11.9], [16.7, 12.4], [16.5, 12.45], [16.4, 11.6], [16.3, 11.6]] },      // the rotating bezel: coin edge, chamfer, the outer lip, the seat the insert lies in, the inner lip, the inner wall
  insert: { material: "insert", pts: [[16.7, 11.9], [19.0, 11.9], [19.0, 12.3], [16.7, 12.4]] },      // the black insert, a hair sloped outward
  crystal: { material: "sapphire", pts: [[0, 11.55], [15.9, 11.55], [15.9, 12.55], [15.8, 12.9], [15.5, 13.15], [15.0, 13.3], [14.4, 13.35], [0, 13.4]] },      // the reference's sapphire: flat, a steep rounded edge
};
const LUG = { l2l: 47.6, lugw: 20, lugT: 2.9, flare: 3.6, zTop: 9.3, zTip: 6.2, zBottom: 3.0 };
const CROWN = { w: 6.4, h: 3.0, z: 6.0 };
const STRAP = { thick: 3.0, z: 3.2 };

// draw the sheet so it can be read (and, later, drawn in Illustrator)
{ const svg = document.getElementById("sheet"); let html = "";
  for (const [name, p] of Object.entries(SHEET)) { const d = p.pts.map(([r, z], i) => `${i ? "L" : "M"}${(r - 0).toFixed(2)} ${(15 - z).toFixed(2)}`).join("") + "Z";
    html += `<path d="${d}" fill="${name === "crystal" ? "#4c8fd4" : name === "insert" ? "#555" : "#9b8a5a"}" fill-opacity="0.5" stroke="#ddd" stroke-width="0.08"/>`; }
  html += `<line x1="0" y1="0" x2="0" y2="16" stroke="#777" stroke-width="0.06" stroke-dasharray="0.3 0.3"/><line x1="0" y1="${15 - DIAL_Z}" x2="15" y2="${15 - DIAL_Z}" stroke="#d44" stroke-width="0.06"/>`;
  svg.innerHTML = html; }

// ── 2 · materials: a small named list ──
const METAL = { steel: "#c9c9c6", gold: scene3.metal }; let metalHex = METAL.steel; const leatherHex = scene3.leather, floorHex = scene3.floor;      // the reference is steel; Gold is the dial's own choice
const MATERIALS = {
  polished: () => Object.assign(new THREE.MeshPhysicalMaterial({ color: metalHex, metalness: 1, roughness: 0.18 }), { userData: { metal: true } }),
  brushed: () => Object.assign(new THREE.MeshPhysicalMaterial({ color: metalHex, metalness: 1, roughness: 0.42, anisotropy: 0.7 }), { userData: { metal: true } }),      // brushed: the highlight stretched along the grain (circular on the spun parts, straight on the body)
  paint: (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0, roughness: 0.45, clearcoat: 0.9, clearcoatRoughness: 0.15 }),      // a printed or applied marker's lacquer
  insert: () => new THREE.MeshPhysicalMaterial({ color: scene3.insert.top, metalness: 0.6, roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  sapphire: () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.0, transmission: 1, thickness: 0.05, ior: 1.76, transparent: true, side: THREE.DoubleSide }),
  leather: () => new THREE.MeshPhysicalMaterial({ color: leatherHex, metalness: 0, roughness: 0.75 }),
  floor: () => new THREE.MeshStandardMaterial({ color: floorHex, metalness: 0, roughness: 0.9 }),
  ink: (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0, roughness: 0.5 }),
  hand: (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0.9, roughness: 0.42 }),
};

// ── 3 · the scene ──
const canvas = document.getElementById("gl"), status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
const scene = new THREE.Scene(); scene.background = new THREE.Color(floorHex);
// the room the metal and the glass reflect: a studio, not three.js's RoomEnvironment — that one has a bright ceiling panel
// straight over the watch, which the crystal threw back into the camera as a white disc. Here the zenith (the camera's
// side) is dark, two big softboxes stand low at the sides, a smaller fill behind the camera's shoulder
function studio() { const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.MeshBasicMaterial({ color: 0x3a3a3a, side: THREE.BackSide })));      // a mid-grey room, as the reference's reflections say
  const box = (w, h, x, y, z, lum) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(lum) })); m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
  box(70, 50, -60, 45, -40, 9); box(60, 40, 70, 25, 0, 3); box(40, 20, 0, 20, 70, 2); box(50, 30, 0, 12, -70, 1.5); box(40, 40, 0, 90, 20, 0.9);      // the key softbox high at the upper left (the reference's), a fill right, front, back, a soft one overhead
  return s; }
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(studio(), 0.04).texture;
// the camera looks straight down the dial's axis (three's Y); 12 o'clock is −Z on screen's up. A long lens: little perspective
const camera = new THREE.PerspectiveCamera(22, 1, 10, 2000); camera.up.set(0, 1, 0);
// two views: Top — straight down the axis, the app's; Photo — the reference's three-quarter view, from the lower right,
// 36° up, the watch turned so that 12 points to the upper left, a 50 mm lens's perspective
function placeCamera(view) { watch.rotation.y = view === "top" ? 0 : -10 * Math.PI / 180;      // in the photo view the watch is turned a little, so 12 sits at the upper left
  if (view === "top") { camera.fov = 13; camera.position.set(0, 325, 0); camera.up.set(0, 0, -1); camera.lookAt(0, 0, 0); }
  else { camera.fov = 22; const el = 36 * Math.PI / 180, az = -38 * Math.PI / 180, d = 190; camera.position.set(Math.sin(az) * Math.cos(el) * d, Math.sin(el) * d, Math.cos(az) * Math.cos(el) * d); camera.up.set(0, 1, 0); camera.lookAt(0, -2, 0); }
  camera.updateProjectionMatrix(); }
const K = scene3.size;      // the case scaled to the dial, as watch.js does
const watch = new THREE.Group(); watch.scale.setScalar(K); scene.add(watch);
const Z0 = -DIAL_Z * K;     // the dial's face at y = 0 of the world, the caseback below

// the lathe parts from the sheet
for (const [name, p] of Object.entries(SHEET)) {
  const geo = new THREE.LatheGeometry(p.pts.map(([r, z]) => new THREE.Vector2(r, z - DIAL_Z)), name === "bezel" ? 720 : 256);
  if (name === "bezel") { const pos = geo.attributes.position;      // the coin edge: the outer wall's radius rippling 60 times round (the reference's teeth)
    for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), zz = pos.getZ(i), r = Math.hypot(x, zz); if (r < 19.95) continue; const th = Math.atan2(zz, x), k = 1 + 0.022 * Math.cos(60 * th) - 0.022; pos.setX(i, x * k); pos.setZ(i, zz * k); } geo.computeVertexNormals(); }
  const m = new THREE.Mesh(geo, MATERIALS[p.material]()); m.castShadow = name !== "crystal"; m.receiveShadow = true; m.name = name; watch.add(m);
}
// the case body, lugs and all, after the reference photo: ONE outline — the circle with the four lugs grown out of it —
// pulled up from the caseback to the bezel's seat, a wide polished chamfer along the whole top edge (case side and lug
// alike), the flank polished, the top brushed. The lugs are straight here, as the photo's are.
{ const R = 40.5 / 2, { l2l, lugw, lugT, flare } = LUG, half = l2l / 2, xi = lugw / 2, xo = xi + lugT, xb = xo + flare, yb = Math.sqrt(R * R - xb * xb), yc = Math.sqrt(R * R - xi * xi), r = 0.8;
  const sh = new THREE.Shape();
  // walk the outline clockwise seen from above (dial space, y up): start at the top lug's inner left foot
  const lug = (sx, sy) => { const p = (x, y) => [sx * x, sy * y];      // one lug, from its inner foot on the circle up to the tip and down its outer edge to where it meets the circle
    if (sx * sy > 0) { sh.lineTo(...p(xi, half - r)); sh.quadraticCurveTo(...p(xi, half), ...p(xi + r, half)); sh.lineTo(...p(xo - r, half)); sh.quadraticCurveTo(...p(xo, half), ...p(xo, half - r)); sh.bezierCurveTo(...p(xo, half - (half - yb) * 0.5), ...p(xb - 0.6, yb + 1.2), ...p(xb, yb)); }
    else { sh.lineTo(...p(xb, yb)); sh.bezierCurveTo(...p(xb - 0.6, yb + 1.2), ...p(xo, half - (half - yb) * 0.5), ...p(xo, half - r)); sh.quadraticCurveTo(...p(xo, half), ...p(xo - r, half)); sh.lineTo(...p(xi + r, half)); sh.quadraticCurveTo(...p(xi, half), ...p(xi, half - r)); sh.lineTo(...p(xi, yc)); } };
  const arc = (a0, a1) => sh.absarc(0, 0, R, a0, a1, true);      // a stretch of the case's circle, clockwise
  const ab = Math.atan2(yb, xb), ac = Math.atan2(yc, xi);
  sh.moveTo(-xi, yc); lug(-1, 1); sh.lineTo(xi, yc); lug(1, 1);      // top lugs: left tip-ward outer edge… (walked by the lug() cases), then the right one
  arc(ab, -ab); lug(1, -1); sh.lineTo(-xi, -yc); lug(-1, -1); arc(Math.PI + ab, Math.PI - ab); sh.closePath();
  const depth = LUG.zTop - LUG.zBottom - 0.9, geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: 0.9, bevelSize: 0.75, bevelSegments: 2, curveSegments: 48 });
  const m = new THREE.Mesh(geo, [MATERIALS.brushed(), MATERIALS.polished()]); m.rotation.x = -Math.PI / 2; m.position.y = LUG.zBottom - DIAL_Z; m.castShadow = m.receiveShadow = true; m.name = "body"; watch.add(m); }      // the top bevel adds 0.9: the top lands on the bezel seat, under the dial
// the insert's markings, as the reference's: numerals 10 … 50, a long mark at every five minutes, a dot at every minute,
// the triangle at 0 with its lume dot — drawn once on a picture laid on the insert
{ const ri = 16.7, ro = 19.0, n = 2048, px = n / (2 * ro), c = document.createElement("canvas"); c.width = c.height = n; const x = c.getContext("2d");
  x.setTransform(px, 0, 0, -px, n / 2, n / 2);
  const at = (m, r) => [Math.sin(m * 6 * Math.PI / 180) * r, Math.cos(m * 6 * Math.PI / 180) * r];
  x.fillStyle = "#e8e5dc"; x.strokeStyle = "#e8e5dc"; x.lineCap = "round";
  for (let m = 1; m < 60; m++) { if (m % 10 === 0) continue; const [X, Y] = at(m, (ri + ro) / 2 + 0.25); x.beginPath(); x.arc(X, Y, m % 5 ? 0.09 : 0.16, 0, 2 * Math.PI); x.fill(); }      // dots; a bigger one at the fives
  for (let m = 5; m < 60; m += 10) { const [a, b] = at(m, ri + 0.45), [c2, d] = at(m, ro - 0.35); x.lineWidth = 0.28; x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); }      // long marks at 5 · 15 · 25 …
  // the numerals, drawn in picture pixels (a canvas rasterises text at its font size before the transform): their feet to the centre, turned with the bezel, a little condensed
  x.setTransform(1, 0, 0, 1, 0, 0); x.font = `bold ${Math.round(1.75 * px)}px "Helvetica Neue", Arial, sans-serif`; x.textAlign = "center"; x.textBaseline = "middle";
  for (let m = 10; m < 60; m += 10) { const [X, Y] = at(m, (ri + ro) / 2 + 0.05); x.save(); x.translate(n / 2 + X * px, n / 2 - Y * px); x.rotate((m * 6 + (m >= 20 && m <= 40 ? 180 : 0)) * Math.PI / 180); x.scale(0.82, 1); x.fillText(String(m), 0, 0.08 * px); x.restore(); }      // the lower half turned round, as the reference has it: no numeral upside down
  x.setTransform(px, 0, 0, -px, n / 2, n / 2);
  { const [X, Y] = at(0, ro - 0.35); x.beginPath(); x.moveTo(X, Y); x.lineTo(-1.35, ri + 0.5); x.lineTo(1.35, ri + 0.5); x.closePath(); x.fill(); x.fillStyle = "#d8ebc8"; x.beginPath(); x.arc(0, (ri + ro) / 2 + 0.1, 0.42, 0, 2 * Math.PI); x.fill(); }      // the triangle and its lume dot
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 256), new THREE.MeshPhysicalMaterial({ map: tex, transparent: true, roughness: 0.5, metalness: 0 }));
  m.rotation.x = -Math.PI / 2; m.position.y = 12.41 - DIAL_Z; watch.add(m); }      // just over the insert at its inner, higher edge
// the contact shadow: where the case meets the table the light can't get in — a soft dark disc under the whole watch
{ const n = 512, c = document.createElement("canvas"); c.width = c.height = n; const x = c.getContext("2d"), g = x.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
  g.addColorStop(0, "rgba(0,0,0,0.55)"); g.addColorStop(0.55, "rgba(0,0,0,0.45)"); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0, 0, n, n);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(54, 54), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.y = -DIAL_Z + 0.02; watch.add(m); }
// the crown: a cylinder lying along x, out of the case's right side
{ const geo = new THREE.CylinderGeometry(CROWN.w / 2, CROWN.w / 2, CROWN.h + 1.2, 144, 1, false);      // knurled: 18 ridges round its grip
  const pos = geo.attributes.position; for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), zz = pos.getZ(i), rr = Math.hypot(x, zz); if (rr < 0.01) continue; const th = Math.atan2(zz, x), k = 1 + 0.045 * Math.cos(18 * th); pos.setX(i, x * k); pos.setZ(i, zz * k); } geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, MATERIALS.polished()); m.rotation.z = Math.PI / 2; m.position.set(40.5 / 2 + CROWN.h / 2 + 1.1, CROWN.z - DIAL_Z, 0); m.castShadow = m.receiveShadow = true; watch.add(m);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 2.4, 32), MATERIALS.polished()); stem.rotation.z = Math.PI / 2; stem.position.set(40.5 / 2 + 0.6, CROWN.z - DIAL_Z, 0); watch.add(stem); }      // the crown stands off the case on its tube, as every crown does
// the strap: a flat leather bar under the lugs, both ways — or a bracelet (Okay: "Strap is next, try a bracelet")
const straps = { leather: new THREE.Group(), bracelet: new THREE.Group() }; watch.add(straps.leather, straps.bracelet);
for (const sy of [-1, 1]) { const geo = new THREE.BoxGeometry(LUG.lugw, STRAP.thick, 60); const m = new THREE.Mesh(geo, MATERIALS.leather()); m.position.set(0, STRAP.z + STRAP.thick / 2 - DIAL_Z, sy * (40.5 / 2 - 3 + 30)); m.castShadow = m.receiveShadow = true; straps.leather.add(m); }
// the bracelet, after the reference photo (a three-link "Oyster" kind). How such a bracelet is formed: rows of three solid
// links — two outer, one centre — each link a bar with ROUND ENDS (a half-cylinder of the link's thickness), so a row can
// hinge on the next round a pin through those ends; the centre links sit HALF A PITCH OFFSET from the outer ones (the
// brick pattern in the photo), so every pin passes through one centre link and the ends of two outer links. The tops are
// brushed and flat; the bracelet's outer edge wears a polished bevel; the seams read as thin dark lines with a hair of
// light on the rounded end above each. It tapers from the lug width toward the clasp. The end link is one solid piece,
// the lugs' width, its inner edge the case's circle, and it carries the first half centre link.
{ const W0 = LUG.lugw, W1 = 18, P = 7.8, GAP = 0.22, GAPX = 0.18, H = 3.1, LEN = 70, CENTRE = 0.40, END = 5.6;
  const yStart = Math.sqrt((40.5 / 2) ** 2 - (W0 / 2) ** 2) + 0.2;      // the end link meets the case between the lugs
  // one link: a bar `l` long, `h` thick with round ends, `w` wide; the two side faces (its ends across the bracelet) polished, the rest brushed
  const link = (w, l, h, outer) => { const r = 0.9, hh = h / 2, sh = new THREE.Shape();      // the side view: a bar with its end edges rounded (r 0.9), the top flat between them — a half-cylinder end would read as a roller
    sh.moveTo(-l / 2 + r, -hh); sh.lineTo(l / 2 - r, -hh); sh.absarc(l / 2 - r, -hh + r, r, -Math.PI / 2, 0, false); sh.lineTo(l / 2, hh - r); sh.absarc(l / 2 - r, hh - r, r, 0, Math.PI / 2, false);
    sh.lineTo(-l / 2 + r, hh); sh.absarc(-l / 2 + r, hh - r, r, Math.PI / 2, Math.PI, false); sh.lineTo(-l / 2, -hh + r); sh.absarc(-l / 2 + r, -hh + r, r, Math.PI, 3 * Math.PI / 2, false);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: w - 0.5, bevelEnabled: true, bevelThickness: 0.25, bevelSize: 0.25, bevelSegments: 3, curveSegments: 12 });      // the bevel: the side edges rounded — the polished bevel along the bracelet's outer edge
    geo.translate(0, 0, -(w - 0.5) / 2);
    const m = new THREE.Mesh(geo, [MATERIALS.polished(), MATERIALS.brushed()]); m.rotation.y = Math.PI / 2;      // the bar runs along z (the bracelet), its width along x
    m.castShadow = m.receiveShadow = true; return m; };
  // the bracelet lies on the table as the reference's does: level past the lugs, then down over 18 mm, then flat on the leather

const D = scene3.d, PX = 64;      // pixels a millimetre on the plate's picture
