<title>Dither Specimens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* a specimen sheet: tiles of the same two gradients, each through one dither; night ground like the showcase */
  :root { --ground: #141413; --tile: #1b1a1f; --light: #8d8a93; --ink: rgb(255 255 255 / 0.78); --quiet: rgb(255 255 255 / 0.45); --rule: rgb(255 255 255 / 0.16); color-scheme: dark; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--quiet); margin: 0 0 20px; max-width: 70ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 20px; padding: 12px 0; border-block: 1px solid var(--rule); }
  .bar label { display: flex; gap: 10px; align-items: center; color: var(--quiet); }
  .bar input[type=range] { width: 140px; accent-color: #b9b9b6; }
  .bar output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--tile); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  figcaption { padding: 10px 12px 12px; border-top: 1px solid var(--rule); }
  figcaption b { font-weight: 600; } figcaption .n { color: var(--quiet); margin-right: 6px; font-variant-numeric: tabular-nums; }
  figcaption p { margin: 4px 0 0; color: var(--quiet); font-size: 12.5px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border: 1px solid var(--rule); border-radius: 999px; margin-left: 6px; color: var(--quiet); }
</style>
<main>
  <h1>Dither specimens</h1>
  <p class="lede">Each tile: a straight ramp from no light to full light on top, and a spotlight's soft edge below, in the showcase's grey on the night ground. Numbered, so you can name the ones you want for the dial and for the background.</p>
  <div class="bar">
    <label>Pixel <input id="px" type="range" min="1" max="8" step="1" value="3"><output id="px-o">3</output></label>
    <label>Levels <input id="lv" type="range" min="2" max="5" step="1" value="2"><output id="lv-o">2</output></label>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
// ── threshold maps: t(x, y, frame) in 0…1; a pixel lights where its share of light is above t ──
const bayer = (n) => {                                       // the recursive Bayer matrix, n = 2, 4, 8…
  let m = [[0]];
  while (m.length < n) {
    const k = m.length, next = Array.from({ length: 2 * k }, () => new Array(2 * k));
    for (let y = 0; y < k; y++) for (let x = 0; x < k; x++) {
      const v = 4 * m[y][x];
      next[y][x] = v; next[y][x + k] = v + 2; next[y + k][x] = v + 3; next[y + k][x + k] = v + 1;
    }
    m = next;
  }
  return (x, y) => (m[y % n][x % n] + 0.5) / (n * n);
};
const B4 = bayer(4);
const mod = (a, n) => ((a % n) + n) % n, frac = (v) => v - Math.floor(v);
const ranked = (n, key) => {                                 // any n × n order: rank the cells by `key`, Bayer to break ties
  const b = bayer(n >= 8 ? 8 : n), cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) cells.push({ x, y, k: key(x, y) + b(x, y) * 1e-3 });
  cells.sort((p, q) => p.k - q.k);
  const t = new Float32Array(n * n); cells.forEach((c, r) => (t[c.y * n + c.x] = (r + 0.5) / (n * n)));
  return (x, y) => t[mod(y, n) * n + mod(x, n)];
};
// blue noise, made once by a small void-and-cluster (32 × 32): each next pixel goes where the lit ones are thinnest
const blue = (() => {
  const N = 32, sigma = 1.5, rank = new Int32Array(N * N).fill(-1), energy = new Float32Array(N * N);
  const add = (i, s) => { const cx = i % N, cy = (i / N) | 0; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = Math.abs(x - cx), dy = Math.abs(y - cy); dx = Math.min(dx, N - dx); dy = Math.min(dy, N - dy);
    energy[y * N + x] += s * Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma)); } };
  let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let r = 0; r < N * N; r++) {
    let best = -1, low = Infinity;
    for (let i = 0; i < N * N; i++) if (rank[i] < 0) { const e = energy[i] + rnd() * 1e-6; if (e < low) { low = e; best = i; } }
    rank[best] = r; add(best, 1);
  }
  return (x, y) => (rank[mod(y, N) * N + mod(x, N)] + 0.5) / (N * N);
})();
const SPECIMENS = [
  ["Bayer 2 × 2", "the coarsest ordered weave: four shades, a hard grid", bayer(2)],
  ["Bayer 4 × 4 · checks", "what the playbox calls checks: sixteen shades, even and crisp", bayer(4)],
  ["Bayer 8 × 8", "the same idea finer: sixty-four shades, the cross-hatched look of old games", bayer(8)],
  ["X checks", "the checks' weave with both diagonals of each 4 × 4 lit first: midtones read as small x's, not +'s", ranked(4, (x, y) => (x === y || x + y === 3 ? 0 : 10))],
  ["Cluster dots", "print's halftone in pixels: round dots that grow and merge, on a 45° screen", ranked(8, (x, y) => -(Math.cos((x + y) * Math.PI / 4) + Math.cos((x - y) * Math.PI / 4)))],
  ["Line screen · 4", "upright stripes 4 apart, each whole column at a time, thickening from the middle: five shades, no specks", ranked(4, (x) => [1, 0, 2, 3][x] * 10)],
  ["Line screen · 8", "the same, coarser: stripes 8 apart, nine shades", ranked(8, (x) => [3, 4, 2, 5, 1, 6, 0, 7][x] * 10)],
  ["Diagonal lines", "engraving-like hatching at 45°, whole diagonals: five shades", ranked(4, (x, y) => [1, 0, 2, 3][mod(x + y, 4)] * 10)],
  ["Crosshatch", "one set of diagonals, then the other across it, then the gaps: like hand hatching", ranked(8, (x, y) => (mod(x + y, 4) === 0 ? 0 : mod(x - y, 4) === 0 ? 10 : 20 + (mod(x + y, 4) === 2 ? 0 : 5)))],
  ["Blue noise", "Obra Dinn's choice: no visible grid, evenly spread specks; calm when it moves", blue],
  ["Interleaved gradient noise", "a one-line game-shader noise (Jimenez, 2014): fine diagonal shimmer, no texture needed", (x, y) => frac(52.9829189 * frac(0.06711056 * x + 0.00583715 * y))],
  ["R2 quasi-random", "Martin Roberts' R2 sequence: blue-noise-like evenness from one formula", (x, y) => frac(0.7548776662 * x + 0.56984029 * y + 0.5)],
  ["White noise", "plain random: grainy and clumpy, for comparison", (x, y) => frac(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453)],
  ["Sparkle · blue noise", "blue noise shifted every frame: the edge twinkles while the shape stays", (x, y, f) => frac(blue(x, y) + f * 0.618034), true],
  ["Sparkle · gradient noise", "interleaved gradient noise stepped each frame, as in game temporal dither: a fine fizz", (x, y, f) => frac(52.9829189 * frac(0.06711056 * (x + 5.588238 * f) + 0.00583715 * (y + 5.588238 * f))), true],
  ["Sparkle · glints", "Bayer 4 × 4, with a few pixels per frame thrown on at random: still, with stray glints", (x, y, f) => { const r = frac(Math.sin((x + f * 7.1) * 12.9898 + (y - f * 3.3) * 78.233) * 43758.5453); return r < 0.015 ? 0 : B4(x, y); }, true],
  ["Floyd–Steinberg", "error diffusion: each pixel's rounding error pushed to its neighbours. Organic, but crawls when anything moves", "fs"],
  ["Atkinson", "the early Mac's error diffusion: loses some error on purpose, so lights and darks open up", "atkinson"],
];
// ── the two gradients: a ramp, and a spotlight's soft edge ──
const W = 300, H = 150;
const value = (X, Y) => {
  if (Y < H / 2) return X / (W - 1);                                         // the ramp
  const d = Math.hypot(X - W * 0.25, (Y - H / 2) * 2.2 - 60) / 150;          // a soft-edged oval, its edge across the tile
  return Math.min(1, Math.max(0, (1.05 - d) / 0.55));
};
const grid = document.getElementById("grid"), tiles = [];
SPECIMENS.forEach(([name, note, t, moving], i) => {
  const fig = document.createElement("figure"), c = document.createElement("canvas");
  fig.append(c);
  const cap = document.createElement("figcaption");
  cap.innerHTML = `<span class="n">${i + 1}</span><b>${name}</b>${moving ? '<span class="tag">moves</span>' : ""}${typeof t === "string" ? '<span class="tag">still images only</span>' : ""}<p>${note}</p>`;
  fig.append(cap); grid.append(fig);
  tiles.push({ c, t, moving });
});
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const lo = rgb("#1b1a1f"), hi = rgb("#8d8a93");
let PX = 3, L = 2, frame = 0;
function draw(tile) {
  const w = Math.ceil(W / PX), h = Math.ceil(H / PX), { c, t } = tile;
  if (c.width !== w) { c.width = w; c.height = h; }
  const g = c.getContext("2d"), img = g.createImageData(w, h), d = img.data, steps = L - 1;
  const v = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) v[y * w + x] = value((x + 0.5) * PX, (y + 0.5) * PX) * steps;
  const out = new Float32Array(w * h);
  if (typeof t === "string") {                                               // error diffusion, left to right, top to bottom
    const k = t === "fs" ? [[1, 0, 7 / 16], [-1, 1, 3 / 16], [0, 1, 5 / 16], [1, 1, 1 / 16]] : [[1, 0, 1 / 8], [2, 0, 1 / 8], [-1, 1, 1 / 8], [0, 1, 1 / 8], [1, 1, 1 / 8], [0, 2, 1 / 8]];
    const e = v.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x, q = Math.max(0, Math.min(steps, Math.round(e[i]))), err = e[i] - q; out[i] = q / steps;
      for (const [dx, dy, f] of k) { const X = x + dx, Y = y + dy; if (X >= 0 && X < w && Y < h) e[Y * w + X] += err * f; }
    }
  } else for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, base = Math.floor(v[i]), q = Math.min(steps, base + (v[i] - base > t(x, y, frame) ? 1 : 0));
    out[i] = q / steps;
  }
  for (let i = 0; i < w * h; i++) for (let k = 0; k < 3; k++) { d[i * 4 + k] = Math.round(lo[k] + (hi[k] - lo[k]) * out[i]); d[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0);
}
const all = () => tiles.forEach(draw);
for (const [id, set] of [["px", (v) => (PX = v)], ["lv", (v) => (L = v)]]) {
  const input = document.getElementById(id);
  input.oninput = () => { set(+input.value); document.getElementById(id + "-o").textContent = input.value; all(); };
}
all();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
setInterval(() => { if (reduce) return; frame++; tiles.filter((x) => x.moving).forEach(draw); }, 1000 / 12);      // the sparkling ones, twelve frames a second
</script>
